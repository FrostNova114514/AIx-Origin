server {
    listen 80;
    server_name aixorigin.innoai.org.cn;

    location ^~ /.well-known/acme-challenge/ {
        alias /www/wwwroot/aixorigin/frontend/dist/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aixorigin.innoai.org.cn;

    ssl_certificate /etc/letsencrypt/live/aixorigin.innoai.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aixorigin.innoai.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;
    charset utf-8;

    root /www/wwwroot/aixorigin/frontend/dist;
    index index.html;

    location /assets/ {
        alias /www/wwwroot/aixorigin/frontend/dist/assets/;
        access_log off;
        expires 30d;
    }

    location /images/ {
        alias /www/wwwroot/aixorigin/frontend/dist/images/;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /www/wwwroot/aixorigin/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /www/wwwroot/aixorigin/media/;
        access_log off;
        expires 30d;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
